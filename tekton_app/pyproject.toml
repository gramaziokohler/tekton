[build-system]
requires = ["setuptools>=66.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tekton-app"
version = "0.1.0"
description = "GUI App module for Tekton"
authors = [{ name = "Lorin Wiedemeier", email = "wiedemeier@arch.ethz.ch" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "compas_timber_fea",
    "compas_dlubal",
    "compas_saf"
]

[tool.setuptools]
package-dir = { "" = "src" }
