[build-system]
requires = ["setuptools>=66.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tekton-core"
version = "0.1.0"
description = "Core module for Tekton"
authors = [{ name = "Lorin Wiedemeier", email = "wiedemeier@arch.ethz.ch" }]
requires-python = ">=3.10"
dependencies = [
    "compas_timber"
]

[tool.setuptools]
package-dir = { "" = "src" }
