[build-system]
requires = ["setuptools>=66.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tekton-saf"
version = "0.1.0"
description = "SAF module for Tekton"
authors = [{ name = "Lorin Wiedemeier", email = "wiedemeier@arch.ethz.ch" }]
requires-python = ">=3.10"
dependencies = [
    "tekton-core",
    "pandas",
    "openpyxl"
]

[tool.setuptools]
package-dir = { "" = "src" }
