name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    if: "!contains(github.event.pull_request.labels.*.name, 'docs-only')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Installs the whole workspace (the four packages under packages/) from
      # uv.lock, using the interpreter pinned in .python-version.
      - name: Install workspace
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -v

  # Rhino 8 runs CPython 3.9 and pip-installs only the Rhino side
  # (tekton_core + tekton-gh, see the `# r:` headers). The workspace
  # itself is locked for 3.10+, so this job builds a plain 3.9 venv with just
  # those two packages and runs the unit tests in Rhino-side mode: tests that
  # need a worker-only package are skipped (tests/unit/conftest.py), anything
  # in the Rhino side that is not 3.9-clean fails here instead of in Rhino.
  rhino-side:
    if: "!contains(github.event.pull_request.labels.*.name, 'docs-only')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the Rhino side on Python 3.9
        run: |
          # The compas_timber revision comes from the one place it is pinned.
          REV=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['uv']['sources']['compas_timber']['rev'])")
          uv venv --python 3.9 .venv39
          VIRTUAL_ENV=.venv39 uv pip install \
            "compas_timber @ git+https://github.com/gramaziokohler/compas_timber.git@${REV}" \
            ./packages/tekton_core ./packages/tekton_gh "pytest >=7"

      - name: Test (Rhino side, 3.9)
        env:
          TEKTON_RHINO_SIDE: "1"
        run: .venv39/bin/python -m pytest tests/unit -v
