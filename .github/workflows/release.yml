name: release

on:
  push:
    tags:
      - 'v*'

# The monorepo packages are not published to PyPI (they depend on each other by
# name and on an unreleased compas_timber branch). This workflow therefore only
# verifies that a tagged revision installs and passes its tests; publishing is
# done manually if and when the packages are released.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install workspace
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -v
