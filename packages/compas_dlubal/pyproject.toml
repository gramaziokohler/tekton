[build-system]
requires = ["setuptools>=66.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compas_dlubal"
version = "0.1.0"
description = "Dlubal module for Tekton"
authors = [{ name = "Lorin Wiedemeier", email = "wiedemeier@arch.ethz.ch" }]
requires-python = ">=3.10"
dependencies = [
    "compas_timber_fea",
    "dlubal-api == 2.13.8"
]

[tool.setuptools]
package-dir = { "" = "src" }
