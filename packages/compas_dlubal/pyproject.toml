[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "compas_dlubal"
version = "0.1.0"
description = "Dlubal module for Tekton"
authors = [{ name = "Lorin Wiedemeier", email = "wiedemeier@arch.ethz.ch" }]
readme = "PYPI.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "compas_timber_fea == 0.1.0",
    "dlubal-api == 2.16.7; python_version >= '3.11'",
    "dlubal-api == 2.13.8; python_version < '3.11'"
]

[project.urls]
Repository = "https://github.com/gramaziokohler/tekton"
Issues = "https://github.com/gramaziokohler/tekton/issues"
Changelog = "https://github.com/gramaziokohler/tekton/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
