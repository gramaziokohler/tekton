[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tekton-gh"
version = "0.1.0"
description = "Grasshopper components for Tekton"
authors = [{ name = "Lorin Wiedemeier", email = "wiedemeier@arch.ethz.ch" }]
readme = "PYPI.md"
license = "MIT"

# Abweichung vom Rest des Monorepos, und zwar mit Absicht: dieses Paket läuft
# in Rhino 8, und Rhino 8 fährt CPython 3.9. Alles hier muss 3.9-Syntax sein
# (keine PEP-604-Unions, kein match, keine slots=-Dataclasses).
requires-python = ">=3.9"

# This is the one package a released component names in its `# r:` header:
# Rhino's pip installs it and, through it, the rest of the Rhino side. The pin
# is exact because both are released in lockstep (see [tool.bumpversion] in
# the root pyproject.toml). From a repo checkout the components still put
# packages/*/src on sys.path instead (see tekton_gh/env.py).
dependencies = [
    "compas_timber_fea == 0.1.0",
]

[project.urls]
Repository = "https://github.com/gramaziokohler/tekton"
Issues = "https://github.com/gramaziokohler/tekton/issues"
Changelog = "https://github.com/gramaziokohler/tekton/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
