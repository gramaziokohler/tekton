[build-system]
requires = ["setuptools>=66.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compas_opensees"
version = "0.1.0"
description = "OpenSees backend for Tekton - pip-installable, headless, runs the whole chain in CI"
authors = [{ name = "Lorin Wiedemeier", email = "wiedemeier@arch.ethz.ch" }]
requires-python = ">=3.10"
dependencies = [
    "compas_timber_fea",
    # openseespywin needs Python >= 3.12 (the Windows wheel), so the solver is
    # conditional; on older interpreters the package imports but cannot run.
    "openseespy >= 3.8; python_version >= '3.12'",
]

[tool.setuptools]
package-dir = { "" = "src" }
