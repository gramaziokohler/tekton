<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="The identity chain. An RFEM member number maps one to one onto a neutral member id, which carries a source element id, which is the GUID of the original beam. Because one beam becomes several members, results attach at a parameter along the physical beam axis." fill="#221f19">
<rect x="0" y="0" width="900" height="250" fill="#f5f2ea"/>
          

          <g>
            <rect x="24" y="40" width="182" height="52" rx="9" fill="#fdfbf7" stroke="#35637e" stroke-width="1.2"></rect>
            <text font-family="Public Sans, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" x="115" y="64" text-anchor="middle" fill="#35637e">RFEM member no</text>
            <text font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#6a6354" x="115" y="81" text-anchor="middle">a row in the result table</text>

            <rect x="254" y="40" width="182" height="52" rx="9" fill="#fdfbf7" stroke="#5c7152" stroke-width="1.2"></rect>
            <text font-family="Public Sans, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" x="345" y="64" text-anchor="middle" fill="#5c7152">neutral member id</text>
            <text font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#6a6354" x="345" y="81" text-anchor="middle">shifts when the model is edited</text>

            <rect x="484" y="40" width="182" height="52" rx="9" fill="#fdfbf7" stroke="#5c7152" stroke-width="1.2"></rect>
            <text font-family="Public Sans, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" x="575" y="64" text-anchor="middle" fill="#5c7152">source_element_id</text>
            <text font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#6a6354" x="575" y="81" text-anchor="middle">carried on every member</text>

            <rect x="714" y="40" width="162" height="52" rx="9" fill="#fdfbf7" stroke="#a2622a" stroke-width="1.3"></rect>
            <text font-family="Public Sans, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" x="795" y="64" text-anchor="middle" fill="#a2622a">the Beam</text>
            <text font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#6a6354" x="795" y="81" text-anchor="middle">what the designer drew</text>
          </g>

          <g stroke="#a2622a" stroke-width="1.4" fill="none">
            <path d="M210.0 66.0 L238.6 66.0"></path>
            <path d="M440.0 66.0 L468.6 66.0"></path>
            <path d="M670.0 66.0 L698.5 66.0"></path>
          </g><polygon points="248.0,66.0 237.5,70.8 237.5,61.2" fill="#a2622a" stroke="none"/><polygon points="478.0,66.0 467.5,70.8 467.5,61.2" fill="#a2622a" stroke="none"/><polygon points="708.0,66.0 697.5,70.8 697.5,61.2" fill="#a2622a" stroke="none"/>
          <g font-family="IBM Plex Mono, Menlo, monospace" font-size="9.5" letter-spacing=".04" fill="#9a927e">
            <text x="229" y="56" text-anchor="middle">1:1</text>
            <text x="459" y="56" text-anchor="middle">lookup</text>
            <text x="689" y="56" text-anchor="middle">GUID</text>
          </g>

          <!-- segmentation illustration -->
          <line stroke="#d5cdba"></line>
          <text font-family="IBM Plex Mono, Menlo, monospace" font-size="9.5" letter-spacing="1.7" fill="#9a927e" x="24" y="146">ONE BEAM BECOMES SEVERAL MEMBERS</text>

          <g>
            <line stroke="#a2622a" stroke-width="3.5" stroke-linecap="round"></line>
            <text font-family="IBM Plex Mono, Menlo, monospace" font-size="9.5" letter-spacing=".04" x="60" y="186" text-anchor="end" fill="#a2622a">the beam</text>
            <g fill="#5c7152" stroke="#fdfbf7" stroke-width="1.5">
              <circle cx="130" cy="182" r="5"></circle>
              <circle cx="250" cy="182" r="5"></circle>
              <circle cx="370" cy="182" r="5"></circle>
              <circle cx="490" cy="182" r="5"></circle>
              <circle cx="610" cy="182" r="5"></circle>
            </g>
            <g font-family="IBM Plex Mono, Menlo, monospace" font-size="9.5" letter-spacing=".04" fill="#5c7152">
              <text x="190" y="169" text-anchor="middle">member</text>
              <text x="310" y="169" text-anchor="middle">member</text>
              <text x="430" y="169" text-anchor="middle">member</text>
              <text x="550" y="169" text-anchor="middle">member</text>
            </g>
            <g font-family="IBM Plex Mono, Menlo, monospace" font-size="9.5" letter-spacing=".04" fill="#9a927e">
              <text x="130" y="204" text-anchor="middle">t = 0</text>
              <text x="610" y="204" text-anchor="middle">t = 1</text>
            </g>
          </g>

          <g>
            <rect x="656" y="152" width="220" height="60" rx="9" fill="#ece6d9" stroke="#c3baa4" stroke-width="1"></rect>
            <text font-family="IBM Plex Mono, Menlo, monospace" font-size="9.5" letter-spacing=".04" x="674" y="172" fill="#a2622a">ENVELOPE — what the designer sees</text>
            <text font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#6a6354" x="674" y="189">max utilization, max deflection</text>
            <text font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#6a6354" x="674" y="204">samples underneath, for diagrams</text>
          </g>

          <text font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#6a6354" x="24" y="238">Results attach at a parameter on the physical axis. The analysis mesh is never handed back — the designer asked about their beam, not our discretization.</text>
        </svg>