<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Translation pipeline. A timber model and four authored policy inputs enter the translator, which emits the neutral model and an assumptions report. Loads are applied afterwards, then preflight runs before anything is pushed." fill="#f2eddf">
          <defs>
            <marker id="m2" viewBox="0 0 10 9" refX="9" refY="4.5" markerWidth="7" markerHeight="6.5" orient="auto">
              <path d="M0,0 L10,4.5 L0,9 Z" fill="#f2eddf"></path>
            </marker>
            <marker id="m2s" viewBox="0 0 10 9" refX="9" refY="4.5" markerWidth="7" markerHeight="6.5" orient="auto">
              <path d="M0,0 L10,4.5 L0,9 Z" fill="#9dba8d"></path>
            </marker>
          </defs>
<rect x="0" y="0" width="900" height="330" fill="#15140e"/>

          <text font-family="IBM Plex Mono, Menlo, monospace" font-size="9.5" letter-spacing="1.7" fill="#7d7561" x="20" y="28">AUTHORED ON THE CANVAS</text>
          <g>
            <rect x="20" y="40" width="148" height="26" rx="13" fill="#282619" stroke="#4b4634" stroke-width="1"></rect>
            <text font-family="IBM Plex Mono, Menlo, monospace" font-size="9.5" letter-spacing=".04" x="94" y="57" text-anchor="middle">timber model</text>
            <rect x="20" y="74" width="148" height="26" rx="13" fill="#282619" stroke="#4b4634" stroke-width="1"></rect>
            <text font-family="IBM Plex Mono, Menlo, monospace" font-size="9.5" letter-spacing=".04" x="94" y="91" text-anchor="middle">joint policy</text>
            <rect x="20" y="108" width="148" height="26" rx="13" fill="#282619" stroke="#4b4634" stroke-width="1"></rect>
            <text font-family="IBM Plex Mono, Menlo, monospace" font-size="9.5" letter-spacing=".04" x="94" y="125" text-anchor="middle">plate policy</text>
            <rect x="20" y="142" width="148" height="26" rx="13" fill="#282619" stroke="#4b4634" stroke-width="1"></rect>
            <text font-family="IBM Plex Mono, Menlo, monospace" font-size="9.5" letter-spacing=".04" x="94" y="159" text-anchor="middle">material grade</text>
            <rect x="20" y="176" width="148" height="26" rx="13" fill="#282619" stroke="#4b4634" stroke-width="1"></rect>
            <text font-family="IBM Plex Mono, Menlo, monospace" font-size="9.5" letter-spacing=".04" x="94" y="193" text-anchor="middle">source units</text>
          </g>
          <g stroke="#f2eddf" stroke-width="1" fill="none" marker-end="url(#m2)" opacity=".75">
            <path d="M172 53 L196 53 L196 118 L214 118"></path>
            <path d="M172 87 L196 87 L196 118"></path>
            <path d="M172 121 L206 121 L206 124 L214 124"></path>
            <path d="M172 155 L196 155 L196 130 L214 130"></path>
            <path d="M172 189 L196 189 L196 130"></path>
          </g>

          <!-- translator -->
          <rect x="218" y="40" width="196" height="162" rx="9" fill="#1f1d16" stroke="#9dba8d" stroke-width="1.4"></rect>
          <text font-family="Public Sans, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" x="316" y="64" text-anchor="middle" fill="#9dba8d">TimberToStructural</text>
          <line stroke="#3d3929"></line>
          <g font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#ada48d">
            <text x="238" y="96">geometry scaled to metres</text>
            <text x="238" y="114">graph nodes → structural nodes</text>
            <text x="238" y="132">segments → members</text>
            <text x="238" y="150">joints → releases, per policy</text>
            <text x="238" y="168">dimensions → shared sections</text>
            <text x="238" y="186">plates → surfaces + thicknesses</text>
          </g>

          <g stroke="#9dba8d" stroke-width="1.3" fill="none" marker-end="url(#m2s)">
            <path d="M418 90 L446 90"></path>
            <path d="M418 160 L446 160"></path>
          </g>

          <rect x="450" y="66" width="182" height="48" rx="9" fill="#1f1d16" stroke="#9dba8d" stroke-width="1.3"></rect>
          <text font-family="Public Sans, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" x="541" y="88" text-anchor="middle" fill="#9dba8d">structural model</text>
          <text font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#ada48d" x="541" y="105" text-anchor="middle">nodes · members · sections</text>

          <rect x="450" y="136" width="182" height="48" rx="9" fill="#282619" stroke="#4b4634" stroke-width="1"></rect>
          <text font-family="Public Sans, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" x="541" y="158" text-anchor="middle">assumptions report</text>
          <text font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#ada48d" x="541" y="175" text-anchor="middle">its own output, on the canvas</text>

          <g stroke="#f2eddf" stroke-width="1.2" fill="none" marker-end="url(#m2)">
            <path d="M636 90 L664 90"></path>
            <path d="M760 118 L760 140"></path>
          </g>

          <rect x="668" y="66" width="184" height="48" rx="9" fill="#1f1d16" stroke="#4b4634" stroke-width="1"></rect>
          <text font-family="Public Sans, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" x="760" y="88" text-anchor="middle">apply loads</text>
          <text font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#ada48d" x="760" y="105" text-anchor="middle">point → node · beam → its members</text>

          <rect x="668" y="144" width="184" height="48" rx="9" fill="#1f1d16" stroke="#e3b458" stroke-width="1.4"></rect>
          <text font-family="Public Sans, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" x="760" y="166" text-anchor="middle" fill="#e3b458">preflight</text>
          <text font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#ada48d" x="760" y="183" text-anchor="middle">supports · connectivity · sections</text>

          <line stroke="#3d3929"></line>
          <g font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#ada48d">
            <text x="20" y="260">Loads arrive after translation because a point load needs a node and a line load needs the members a beam was split into.</text>
            <text x="20" y="278">Neither exists until the idealization has run, so the authoring components describe loads geometrically and this step resolves them.</text>
            <text x="20" y="304" fill="#e3b458">The same preflight runs again on push — canvas, desktop and command line report identically.</text>
          </g>
        </svg>